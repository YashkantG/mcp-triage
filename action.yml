name: "mcp-triage"
description: "Security scanner for MCP (Model Context Protocol) servers"
author: "Yash Kant Gautam"
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Path to scan (a server directory, source file, or mcp.json manifest)."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the step: high, medium, or low."
    required: false
    default: "high"
  format:
    description: "Output format: table, json, sarif, or badge."
    required: false
    default: "table"
  config:
    description: "Path to a .mcptriage.toml (or its containing directory)."
    required: false
    default: ""
  ignore-rule:
    description: "Space-separated rule IDs to suppress, e.g. 'MCP004 MCP301'."
    required: false
    default: ""
  version:
    description: "Version of mcp-triage to install (defaults to latest)."
    required: false
    default: ""
  upload-sarif:
    description: "If true (and format is sarif), upload results to GitHub Code Scanning."
    required: false
    default: "false"

outputs:
  sarif-file:
    description: "Path to the generated SARIF file, when format is sarif."
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Install mcp-triage
      shell: bash
      env:
        MCP_TRIAGE_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$MCP_TRIAGE_VERSION" ]; then
          pip install "mcp-triage==$MCP_TRIAGE_VERSION"
        else
          pip install mcp-triage
        fi

    - name: Run mcp-triage
      id: scan
      shell: bash
      env:
        MCP_TRIAGE_PATH: ${{ inputs.path }}
        MCP_TRIAGE_FORMAT: ${{ inputs.format }}
        MCP_TRIAGE_FAIL_ON: ${{ inputs.fail-on }}
        MCP_TRIAGE_CONFIG: ${{ inputs.config }}
        MCP_TRIAGE_IGNORE_RULES: ${{ inputs.ignore-rule }}
      run: |
        ARGS=("$MCP_TRIAGE_PATH" --format "$MCP_TRIAGE_FORMAT" --fail-on "$MCP_TRIAGE_FAIL_ON")
        if [ -n "$MCP_TRIAGE_CONFIG" ]; then
          ARGS+=(--config "$MCP_TRIAGE_CONFIG")
        fi
        if [ -n "$MCP_TRIAGE_IGNORE_RULES" ]; then
          read -r -a IGNORE_RULES <<< "$MCP_TRIAGE_IGNORE_RULES"
        else
          IGNORE_RULES=()
        fi
        for rule in "${IGNORE_RULES[@]}"; do
          ARGS+=(--ignore-rule "$rule")
        done

        if [ "$MCP_TRIAGE_FORMAT" = "sarif" ]; then
          if mcp-triage scan "${ARGS[@]}" > mcp-triage-results.sarif; then
            EXIT_CODE=0
          else
            EXIT_CODE=$?
          fi
          echo "sarif-file=mcp-triage-results.sarif" >> "$GITHUB_OUTPUT"
        else
          if mcp-triage scan "${ARGS[@]}"; then
            EXIT_CODE=0
          else
            EXIT_CODE=$?
          fi
        fi
        exit $EXIT_CODE

    - name: Upload SARIF to GitHub Code Scanning
      if: always() && inputs.format == 'sarif' && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: mcp-triage-results.sarif
