name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke-test the CLI against its own fixtures
        run: |
          mcp-triage scan tests/fixtures/vulnerable_server --format json || true
          mcp-triage scan tests/fixtures/clean_server

      - name: Dogfood — mcp-triage scans itself
        # Uses the repo's own .mcptriage.toml. If this fails, either we
        # introduced a real problem or a rule got noisier; both are worth
        # blocking on.
        run: mcp-triage scan .

      - name: Verify the committed self-scan badge is current
        if: matrix.python-version == '3.12'
        run: |
          mcp-triage scan . --format badge > /tmp/badge.json
          diff /tmp/badge.json .github/badges/self-scan.json \
            || (echo "::error::self-scan badge is stale — regenerate with: mcp-triage scan . --format badge > .github/badges/self-scan.json" && exit 1)
